{% extends "base.html" %}
{% set active = "quicksale" %}

{% block head %}
<style>
    body { background: #0a0a0a; }
    .qs-wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
        padding-bottom: 100px;
    }
    .qs-header {
        text-align: center;
        padding: 20px 0 12px;
    }
    .qs-header h1 {
        font-size: 22px;
        color: #fff;
        margin: 0;
    }
    .qs-header p {
        color: #888;
        font-size: 13px;
        margin-top: 4px;
    }
    .qs-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 13px;
        color: #22c55e;
        font-weight: 600;
    }
    .qs-status .dot {
        width: 8px; height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    .scan-input-area {
        background: #161616;
        border: 2px solid #333;
        border-radius: 16px;
        padding: 24px 16px;
        text-align: center;
        margin: 16px 0;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .scan-input-area.active {
        border-color: #22c55e;
        box-shadow: 0 0 20px rgba(34,197,94,0.15);
    }
    .scan-input-area input {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        text-align: center;
        width: 100%;
        outline: none;
        letter-spacing: 2px;
        font-family: 'Courier New', monospace;
    }
    .scan-input-area input::placeholder {
        color: #444;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0;
        font-family: -apple-system, sans-serif;
    }
    .scan-input-area .hint {
        color: #666;
        font-size: 12px;
        margin-top: 8px;
    }

    .qs-feedback {
        border-radius: 14px;
        padding: 18px;
        margin: 12px 0;
        animation: slideUp 0.3s ease;
        display: none;
    }
    .qs-feedback.success {
        display: block;
        background: linear-gradient(135deg, #052e16, #14532d);
        border: 1px solid #22c55e40;
    }
    .qs-feedback.error {
        display: block;
        background: linear-gradient(135deg, #2a0a0a, #3b1111);
        border: 1px solid #ef444440;
    }
    .qs-feedback .product-name {
        font-size: 17px;
        font-weight: 700;
        color: #fff;
    }
    .qs-feedback .product-detail {
        font-size: 13px;
        color: #aaa;
        margin-top: 3px;
    }
    .qs-feedback .deducted {
        font-size: 14px;
        color: #22c55e;
        font-weight: 600;
        margin-top: 6px;
    }
    .qs-feedback.error .deducted {
        color: #f87171;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .qs-log {
        margin-top: 20px;
    }
    .qs-log h3 {
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }
    .qs-log-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: #161616;
        border-radius: 10px;
        margin-bottom: 6px;
    }
    .qs-log-item .name {
        color: #ddd;
        font-size: 14px;
        font-weight: 500;
    }
    .qs-log-item .time {
        color: #666;
        font-size: 12px;
    }
    .qs-log-item .qty {
        color: #22c55e;
        font-size: 13px;
        font-weight: 600;
    }

    .qs-counter {
        text-align: center;
        margin: 16px 0;
    }
    .qs-counter .num {
        font-size: 48px;
        font-weight: 800;
        color: #22c55e;
    }
    .qs-counter .label {
        color: #666;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
{% endblock %}

{% block content %}
<div class="qs-wrap">
    <div class="qs-header">
        <h1>Quick Sale</h1>
        <p>Scan barcode to deduct from stock</p>
        <div class="qs-status">
            <span class="dot"></span>
            <span>Ready to scan</span>
        </div>
    </div>

    <div class="scan-input-area active" id="scan-area">
        <input type="text" id="barcode-field" placeholder="Scan barcode here..." autofocus autocomplete="off">
        <div class="hint">USB scanner types here automatically</div>
    </div>

    <div class="qs-feedback" id="feedback"></div>

    <div class="qs-counter">
        <div class="num" id="sold-count">0</div>
        <div class="label">items sold this session</div>
    </div>

    <div class="qs-log" id="log-section" style="display:none;">
        <h3>Recent scans</h3>
        <div id="log-list"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const barcodeField = document.getElementById('barcode-field');
const feedback = document.getElementById('feedback');
const logList = document.getElementById('log-list');
const logSection = document.getElementById('log-section');
let soldCount = 0;
let processing = false;

// Keep focus on input always
barcodeField.addEventListener('blur', () => {
    setTimeout(() => barcodeField.focus(), 100);
});
document.addEventListener('click', () => barcodeField.focus());

// USB scanners send characters fast then Enter
barcodeField.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        const code = barcodeField.value.trim();
        if (code && !processing) {
            processSale(code);
        }
    }
});

async function processSale(barcode) {
    processing = true;
    barcodeField.value = '';
    barcodeField.placeholder = 'Processing...';

    // Play beep
    playBeep();

    // Look up product name
    let productName = barcode;
    try {
        const lookupResp = await fetch('/api/product/' + barcode);
        const lookupData = await lookupResp.json();
        if (lookupData.found) {
            productName = lookupData.name;
        }
    } catch {}

    // Deduct stock
    try {
        const body = new FormData();
        body.append('barcode', barcode);
        body.append('quantity', '1');

        const resp = await fetch('/api/stock/sold', { method: 'POST', body });
        const data = await resp.json();

        if (data.success && data.sold > 0) {
            soldCount++;
            document.getElementById('sold-count').textContent = soldCount;
            showFeedback('success', productName, barcode, data.sold);
            addLog(productName, data.sold);
        } else {
            showFeedback('error', productName, barcode, 0);
        }
    } catch {
        showFeedback('error', productName, barcode, 0);
    }

    barcodeField.placeholder = 'Scan barcode here...';
    processing = false;
    barcodeField.focus();
}

function showFeedback(type, name, barcode, qty) {
    if (type === 'success') {
        feedback.className = 'qs-feedback success';
        feedback.innerHTML = `
            <div class="product-name">${name}</div>
            <div class="product-detail">${barcode}</div>
            <div class="deducted">-${qty} from stock</div>`;
    } else {
        feedback.className = 'qs-feedback error';
        feedback.innerHTML = `
            <div class="product-name">${name}</div>
            <div class="product-detail">${barcode}</div>
            <div class="deducted">Not in stock</div>`;
    }
    // Auto-clear after 3s
    setTimeout(() => { feedback.className = 'qs-feedback'; }, 3000);
}

function addLog(name, qty) {
    logSection.style.display = 'block';
    const time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const item = document.createElement('div');
    item.className = 'qs-log-item';
    item.innerHTML = `<span class="name">${name}</span><span class="qty">-${qty}</span><span class="time">${time}</span>`;
    logList.prepend(item);
    // Keep max 20
    while (logList.children.length > 20) logList.lastChild.remove();
}

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1200;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    } catch {}
}

// Auto-focus on page load
window.addEventListener('load', () => barcodeField.focus());
</script>
{% endblock %}
